<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>助理工作臺</title>
<script src="lib/partybus.js"></script><style>body{margin:0;background:#080d18;color:#edf1f7;font:15px system-ui;padding:18px}main{max-width:760px;margin:auto}.card{background:#141c2e;border:1px solid #2f3c58;padding:16px;margin:12px 0;border-radius:8px}button,select,input{padding:8px;margin:4px;background:#21304a;color:#fff;border:1px solid #526889;border-radius:4px}button{cursor:pointer}.muted{color:#9aa9c1}.role{color:#e8bd64;font-weight:bold}.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.team{background:#0d1423;padding:10px}.hidden{display:none}</style>
<main><h1>多助理工作臺</h1><div id="identity" class="card">連線中…</div><section id="register" class="card hidden"><h2>等待指派</h2><p>請輸入不可重複的助理姓名，等待總助理或管理助理指派。</p><input id="name" maxlength="24" placeholder="助理姓名"><button onclick="register()">送出姓名</button></section><section id="work" class="hidden"><div id="directory" class="card"></div><div id="panel" class="card"></div></section></main>
<script>
const q=new URLSearchParams(location.search), room=q.get('room')||localStorage.getItem('pgg_last_room')||'0000', host=q.get('host')||location.host, forced=q.get('assistantDevice');
const key='pgg_assistant_device_v2'+(forced?'.'+forced:''); let device=forced||localStorage.getItem(key); if(!device){device='a-'+crypto.randomUUID();localStorage.setItem(key,device)}
let mine=null,snap=null,codes={}; PartyBus.init({role:'assistant',roomId:room,host,deviceId:device});
function register(){const name=document.querySelector('#name').value.trim();if(name)PartyBus.emit('assistant_register',{name})}
function emit(type,payload){PartyBus.emit(type,payload)}
function fmtAge(t){const s=Math.max(0,Math.floor((Date.now()-t)/1000));return s<60?'剛剛':s<3600?Math.floor(s/60)+' 分鐘前':Math.floor(s/3600)+' 小時前'}
function render(){const rec=snap?.assistants?.find(a=>a.deviceId===device);mine=rec||null; document.querySelector('#register').classList.toggle('hidden',!!mine);document.querySelector('#work').classList.toggle('hidden',!mine);document.querySelector('#identity').innerHTML=mine?`<span class=role>${mine.role}</span> · ${mine.name}　房號 ${room}`:'尚未登記助理姓名';if(!mine)return;
 const list=snap.assistants.map(a=>`<li>${a.name} · <b>${a.role}</b>${(mine.role==='chief'||mine.role==='manager')&&a.role!=='chief'?` <select onchange="assign('${a.deviceId}',this.value)"><option value="">指派…</option>${['manager','scorer','grouper','moderator','projector','unassigned'].map(r=>`<option value="${r}">${r}</option>`).join('')}</select>`:''}</li>`).join('');document.querySelector('#directory').innerHTML='<h2>助理管理</h2><ul>'+list+'</ul>'+(mine.role!=='chief'?'<button onclick="emit(\'assistant_become_participant\',{})">轉為參賽者</button>':'');
 const teams=(snap.groups||[]).map(g=>`<div class=team><b>${g.name}</b><br>${g.score} 分 · 在線 ${(g.onlineMembers||[]).length}<br><span class=muted>${(g.onlineMembers||[]).join('、')||'—'}</span>${mine.role==='scorer'?`<br><button onclick="emit('score_adjust',{teamIdx:${g.idx},delta:1})">+1</button><button onclick="emit('score_adjust',{teamIdx:${g.idx},delta:-1})">-1</button>`:''}${mine.role==='grouper'&&snap.groupingMode==='prefix'?`<br><button onclick="emit('prefix_pin_group',{team:'${g.name}',pinned:true})">置頂</button>${(g.name==='其他'||snap.prefixPinnedGroups.includes(g.name))?`<button onclick="notice('${g.name}','confirm')">確認前綴</button><button onclick="notice('${g.name}','rename')">通知改名</button>`:''}`:''}</div>`).join('');
 let p=''; if(mine.role==='scorer')p='<h2>記分</h2><p>僅遊戲開始至結束前可用 +1 / -1。</p>'; else if(mine.role==='grouper')p='<h2>前綴分組</h2><p>「其他」固定置頂；手動置頂後才可確認前綴或通知改名。</p>'; else if(mine.role==='moderator')p='<h2>主持人助理（唯讀）</h2><p>目前題目：'+(snap.currentQuestion?`${snap.currentQuestion.framework} / ${snap.currentQuestion.id}`:'尚未抽題')+'。題目詳細答案與評分要點由既有題庫畫面顯示。</p>'; else if(mine.role==='projector')p='<h2>投影端助理</h2><p>請在投影電腦手動輸入：</p><h3>房號 '+room+'</h3><h3>投影端控制碼 '+(codes.controlCode||'載入中…')+'</h3>'; else if(mine.role==='manager')p='<h2>管理助理</h2><p>可管理四種執行助理與一般設定；遊戲流程控制由總助理保留。</p>'; else if(mine.role==='chief')p='<h2>總助理</h2><p>完整權限；請使用主助理端進行遊戲流程控制。</p>'; else p='<h2>等待指派</h2>';document.querySelector('#panel').innerHTML=p+'<div class=teams>'+teams+'</div>';}
function assign(id,role){if(role)emit('assistant_assign',{deviceId:id,role})} function notice(team,kind){emit('notify_group',{team,kind});alert('已由 '+(mine?.name||'助理')+' 操作：'+fmtAge(Date.now()))}
PartyBus.on('__room_state__',s=>{snap=s;render()});PartyBus.on('__welcome__',p=>{codes=p||{};render()});PartyBus.on('__error__',e=>{if(e.code==='assistant_to_participant'&&confirm(e.message)){location.href='participant.html?room='+encodeURIComponent(room)+'&host='+encodeURIComponent(host)}else console.warn(e)});PartyBus.onStatus(s=>{if(s==='connected'&&q.get('name'))emit('assistant_register',{name:q.get('name'),preferredChief:q.get('chief')==='1'})});
</script></html>
